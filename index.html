<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,user-scalable=yes, initial-scale=1.0,minimum-scale=1.0,maximum-scale=2.0">
        <!-- 기본 글꼴 Gamja Flower (Google Fonts). preconnect로 글꼴 서버에 미리 연결해 로딩을 앞당긴다. -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap">
        <link rel="stylesheet" type="text/css" href="css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
        <script src="js/todo.js"></script>
        <title>TODO 리스트</title>
    </head>
    <body>
        <h1 class="bg-orange-400 text-white px-4 py-2 text-xl text-center mb-4">오늘 할 일 등록하기</h1>
        <form name="frmTodo" method="post" class="px-4">
            <dl class="flex mb-1">
                <dt class="basis-[150px] p-1 bg-amber-400 text-center text-white mr-1">날짜</dt>
                <dd class="grow">
                    <input type="date" name="date" placeholder="날짜 입력" class="border rounded-sm h-10 w-full px-4"> 
                </dd>
            </dl>
            <dl class="flex mb-1">
                <dt class="basis-[150px] p-1 bg-amber-400 text-center text-white mr-1">제목</dt>
                <dd class="grow">
                    <input type="text" name="title" placeholder="제목을 입력하세요" class="border rounded-sm h-10 w-full px-4">
                </dd>
            </dl>
            <dl class="flex mb-4">
                <dt class="basis-[150px] p-1 bg-amber-400 text-center text-white mr-1">내용</dt>
                <dd class="grow">
                    <textarea name="content" placeholder="내용을 입력하세요" class="border rounded-sm h-25 w-full p-4"></textarea>
                </dd>
            </dl>
            <button type="submit" class="bg-lime-500 hover:bg-lime-700 py-2 px-5 rounded-sm text-white text-lg block mx-auto cursor-pointer max-w-xs w-1/2">등록하기</button>
        </form>
        
        <!-- 할 일 조회 필터 (data-filter 값은 todo.filters의 이름과 같다. 선택 표시는 aria-pressed:* 클래스가 맡는다.) -->
        <nav id="todo-filters" class="flex justify-center gap-2 mx-4 mt-6" aria-label="할 일 필터">
            <button type="button" data-filter="all" aria-pressed="true" class="border border-orange-400 rounded-full px-4 py-1 cursor-pointer bg-white hover:bg-orange-100 aria-pressed:bg-orange-400 aria-pressed:text-white">전체 <span data-count>0</span></button>
            <button type="button" data-filter="active" aria-pressed="false" class="border border-orange-400 rounded-full px-4 py-1 cursor-pointer bg-white hover:bg-orange-100 aria-pressed:bg-orange-400 aria-pressed:text-white">진행 중 <span data-count>0</span></button>
            <button type="button" data-filter="done" aria-pressed="false" class="border border-orange-400 rounded-full px-4 py-1 cursor-pointer bg-white hover:bg-orange-100 aria-pressed:bg-orange-400 aria-pressed:text-white">완료 <span data-count>0</span></button>
        </nav>

        <ul id="todo-items" class="m-4 p-4 grid md:grid-cols-2 gap-4"> 
        </ul>

        <script type="text/html" id="tpl">
            <li id="item-${uid}" class="border border-gray-400 rounded-sm group p-4">
                <label class="flex items-center gap-2 mb-1 cursor-pointer w-fit">
                    <input type="checkbox" class="toggle-action w-4 h-4 cursor-pointer" data-uid="${uid}" ${checked}>
                    <span class="text-sm text-gray-500">완료</span>
                </label>
                <div class="group-hover:shadow-md ${doneClass}">[${date}]${title}</div>
                <div class="${doneClass}">${content}</div>
                <div class="flex justify-between gap-1">
                    <button type="button" class="delete-action grow py-2 text-white bg-red-400 hover:bg-red-700 cursor-pointer" data-uid="${uid}">삭제</button>
                    <button type="button" class="edit-action grow py-2 text-white bg-cyan-500 hover:bg-cyan-700 cursor-pointer" data-uid="${uid}">수정</button>
                </div>
            </li>
        </script>
    </body>
</html>
